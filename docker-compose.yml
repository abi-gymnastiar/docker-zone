services:
  dashboard:
    build:
      context: .
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: "${LISTEN_ADDR:-:8080}"
      DOCKER_SOCKET: "${DOCKER_SOCKET:-/var/run/docker.sock}"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped
