services:
  dashboard:
    build:
      context: .
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: "${LISTEN_ADDR:-:8080}"
      DOCKER_SOCKET: "${DOCKER_SOCKET:-/var/run/docker.sock}"
      DATABASE_PATH: "${DATABASE_PATH:-/data/dashboard.db}"
      CONFIG_PATH: "${CONFIG_PATH:-/data/config.yml}"
      WEB_TITLE: "${WEB_TITLE:-}"
      WEB_ICON: "${WEB_ICON:-}"
      WEB_HEADER: "${WEB_HEADER:-}"
      WEB_SUBHEADER: "${WEB_SUBHEADER:-}"
      WEB_FOOTER: "${WEB_FOOTER:-}"
      DEFAULT_BACKGROUND_IMAGE: "${DEFAULT_BACKGROUND_IMAGE:-}"
      DEFAULT_BACKGROUND_SCALE: "${DEFAULT_BACKGROUND_SCALE:-tile}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DATABASE_DIR:-./data}:/data
    restart: unless-stopped

volumes:
  dashboard-data:
